services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pinball
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d pinball"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: "postgresql://user:password@db:5432/pinball?schema=public"
      # API globale (scores mondiaux + claim QR). Injectés depuis .env racine
      # (gitignoré). Absents → outro/QR + classement mondial dégradent en
      # local-only (pas de crash, tout est catché côté serveur).
      GLOBAL_API_URL: "${GLOBAL_API_URL}"
      BORNE_TOKEN: "${BORNE_TOKEN}" # token brk_ par borne, jamais en dur
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  playfield:
    # NEXT_PUBLIC_KEYBOARD_MODE est inliné au BUILD (next build) → build-arg,
    # PAS environment runtime. `disabled` : l'ESP32 réel pilote les boutons,
    # le clavier de jeu reste inerte (H debug toujours actif).
    build:
      context: .
      dockerfile: apps/playfield/Dockerfile
      args:
        NEXT_PUBLIC_KEYBOARD_MODE: "disabled"
    ports:
      - "0:3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  dmd:
    build:
      context: .
      dockerfile: apps/dmd/Dockerfile
    ports:
      - "0:3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  backglass:
    build:
      context: .
      dockerfile: apps/backglass/Dockerfile
    ports:
      - "0:3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  input-bridge:
    build:
      context: .
      dockerfile: apps/input-bridge/Dockerfile
    restart: unless-stopped
    environment:
      # Mode mock tant que le firmware ESP32 n'existe pas. Passer à `serial`
      # uniquement après avoir décommenté `devices:` et fourni un chemin
      # réel /dev/serial/by-id/usb-... (cf. instructions ci-dessous).
      INPUT_BRIDGE_MODE: mock
      SERIAL_PATH: /dev/MOCK_ESP32
      SERIAL_BAUD: "115200"
      SERVER_URL: http://server:3001
    depends_on:
      server:
        condition: service_healthy
    # ──────────────────────────────────────────────────────────────────────
    # Mode serial (ESP32 USB-CDC) — décommenter quand le firmware existe.
    #
    # 1. Brancher l'ESP32 sur la borne. Vérifier le chemin stable :
    #      ls /dev/serial/by-id/
    # 2. Décommenter `devices:` ci-dessous, remplacer le chemin source par le
    #    bon /dev/serial/by-id/usb-... .
    # 3. Passer `INPUT_BRIDGE_MODE=serial` (via .env ou override compose).
    # 4. Vérifier les logs : "serial port opened" attendu.
    #
    # devices:
    #   - "/dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_XX-if00:/dev/MOCK_ESP32"
    # ──────────────────────────────────────────────────────────────────────

volumes:
  postgres_data:
