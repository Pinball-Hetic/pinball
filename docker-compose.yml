services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pinball
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d pinball"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: "postgresql://user:password@db:5432/pinball?schema=public"
      # API globale (scores mondiaux + claim QR). Sur la borne Fliphetic ces
      # valeurs viennent des env vars par-app du dashboard (Operations), PAS du
      # .env racine (gitignoré, absent de la borne). Le `:-` fournit un défaut
      # vide : sans lui, compose émet un warning que l'override Fliphetic capture
      # dans le YAML généré → load en échec. Absents → outro/QR + classement
      # mondial dégradent en local-only (pas de crash, catché côté serveur).
      GLOBAL_API_URL: "${GLOBAL_API_URL:-}"
      BORNE_TOKEN: "${BORNE_TOKEN:-}" # token brk_ par borne, jamais en dur
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  playfield:
    # NEXT_PUBLIC_KEYBOARD_MODE est inliné au BUILD (next build) → build-arg,
    # PAS environment runtime. `disabled` : l'ESP32 réel pilote les boutons,
    # le clavier de jeu reste inerte (H debug toujours actif).
    build:
      context: .
      dockerfile: apps/playfield/Dockerfile
      args:
        NEXT_PUBLIC_KEYBOARD_MODE: "disabled"
    ports:
      - "0:3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  dmd:
    build:
      context: .
      dockerfile: apps/dmd/Dockerfile
    ports:
      - "0:3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  backglass:
    build:
      context: .
      dockerfile: apps/backglass/Dockerfile
    ports:
      - "0:3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  input-bridge:
    build:
      context: .
      dockerfile: apps/input-bridge/Dockerfile
    restart: unless-stopped
    environment:
      # ESP32 réel : device borne = /dev/ttyUSB0 (CP2102), flashé par Fliphetic
      # AVANT le compose up (cf. cycle de chargement, CLAUDE.md).
      INPUT_BRIDGE_MODE: serial
      SERIAL_PATH: /dev/ttyUSB0
      SERIAL_BAUD: "115200"
      SERVER_URL: http://server:3001
    depends_on:
      server:
        condition: service_healthy
    # Mapping DUR du port série hôte → conteneur. Sur la borne, Fliphetic flashe
    # l'ESP32 → /dev/ttyUSB0 présent avant `compose up`. Sur un poste SANS ESP32,
    # `compose up` de ce fichier échoue à créer ce conteneur (attendu : prod = borne).
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"

volumes:
  postgres_data:
