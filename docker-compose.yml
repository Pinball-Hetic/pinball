services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pinball
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d pinball"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: "postgresql://user:password@db:5432/pinball?schema=public"
      # Global API (world scores + QR claim). On the Fliphetic cabinet these
      # values come from the dashboard's per-app env vars (Operations), NOT the
      # root .env (gitignored, absent from the cabinet). The `:-` provides an
      # empty default: without it, compose emits a warning that the Fliphetic
      # override captures in the generated YAML → load fails. Absent → outro/QR +
      # world leaderboard degrade to local-only (no crash, caught server-side).
      GLOBAL_API_URL: "${GLOBAL_API_URL:-}"
      BORNE_TOKEN: "${BORNE_TOKEN:-}" # per-cabinet brk_ token, never hardcoded
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  playfield:
    # NEXT_PUBLIC_KEYBOARD_MODE is inlined at BUILD (next build) → build-arg,
    # NOT runtime environment. `disabled`: the real ESP32 drives the buttons,
    # the game keyboard stays inert (H debug always active).
    build:
      context: .
      dockerfile: apps/playfield/Dockerfile
      args:
        NEXT_PUBLIC_KEYBOARD_MODE: "disabled"
    ports:
      - "0:3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  dmd:
    build:
      context: .
      dockerfile: apps/dmd/Dockerfile
    ports:
      - "0:3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  backglass:
    build:
      context: .
      dockerfile: apps/backglass/Dockerfile
    ports:
      - "0:3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  input-bridge:
    build:
      context: .
      dockerfile: apps/input-bridge/Dockerfile
    restart: unless-stopped
    environment:
      # Real ESP32: cabinet device = /dev/ttyUSB0 (CP2102), flashed by Fliphetic
      # BEFORE compose up (cf. load cycle, CLAUDE.md).
      INPUT_BRIDGE_MODE: serial
      SERIAL_PATH: /dev/ttyUSB0
      SERIAL_BAUD: "115200"
      SERVER_URL: http://server:3001
    depends_on:
      server:
        condition: service_healthy
    # HARD mapping of the host serial port → container. On the cabinet, Fliphetic
    # flashes the ESP32 → /dev/ttyUSB0 present before `compose up`. On a host
    # WITHOUT an ESP32, `compose up` of this file fails to create this container
    # (expected: prod = cabinet).
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"

volumes:
  postgres_data:
