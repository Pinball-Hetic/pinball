services:
  db:
    image: postgres:15-alpine
    container_name: pinball-db-dev
    restart: always
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: pinball_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d pinball_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 384m

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: pinball-server-dev
    working_dir: /app/apps/server
    environment:
      DATABASE_URL: "postgresql://dev_user:dev_password@db:5432/pinball_dev?schema=public"
      NODE_ENV: development
    ports:
      - "3334:3001"
    volumes:
      - ./apps/server/src:/app/apps/server/src
    depends_on:
      db:
        condition: service_healthy
    command: bun --watch src/interface/index.ts
    mem_limit: 256m

  playfield:
    build:
      context: .
      dockerfile: apps/playfield/Dockerfile
    container_name: pinball-playfield-dev
    working_dir: /app/apps/playfield
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_PUBLIC_SOCKET_URL: "http://localhost:3334"
      NEXT_PUBLIC_KEYBOARD_MODE: "simulate-esp32"
      # NEXT_PUBLIC_MAP_ID: "zelda"  # décommenter pour forcer une map (bypass sélecteur)
      NODE_OPTIONS: "--max-old-space-size=2560"
    ports:
      - "3333:3000"
    volumes:
      - ./apps/playfield/src:/app/apps/playfield/src
      - ./apps/playfield/public:/app/apps/playfield/public
      - ./packages/game-engine/src:/app/packages/game-engine/src
      - ./packages/shared-types/src:/app/packages/shared-types/src
      - ./packages/maps:/app/packages/maps
    depends_on:
      - server
    command: bun run dev
    # Force la compilation Turbopack de la page lourde pendant le démarrage :
    # le check ne passe qu'une fois /pinball compilé → débloque dmd ensuite.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/pinball"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 60s
    mem_limit: 3g

  dmd:
    build:
      context: .
      dockerfile: apps/dmd/Dockerfile
    container_name: pinball-dmd-dev
    working_dir: /app/apps/dmd
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
#      NEXT_PUBLIC_SOCKET_URL: "http://localhost:3334"
      NODE_OPTIONS: "--max-old-space-size=1024"
    ports:
      - "3335:3000"
    volumes:
      - ./apps/dmd/src:/app/apps/dmd/src
      - ./packages/shared-types/src:/app/packages/shared-types/src
    depends_on:
      server:
        condition: service_started
      playfield:
        condition: service_healthy
    command: bun run dev
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 10s
      timeout: 8s
      retries: 20
      start_period: 30s
    mem_limit: 1536m

  backglass:
    build:
      context: .
      dockerfile: apps/backglass/Dockerfile
    container_name: pinball-backglass-dev
    working_dir: /app/apps/backglass
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
#      NEXT_PUBLIC_SOCKET_URL: "http://localhost:3334"
    ports:
      - "3336:3000"
    volumes:
      - ./apps/backglass/src:/app/apps/backglass/src
      - ./packages/shared-types/src:/app/packages/shared-types/src
    depends_on:
      server:
        condition: service_started
      dmd:
        condition: service_healthy
    command: bun run dev
    mem_limit: 1536m

  input-bridge:
    build:
      context: .
      dockerfile: apps/input-bridge/Dockerfile
    container_name: pinball-input-bridge-dev
    working_dir: /app/apps/input-bridge
    restart: unless-stopped
    environment:
      NODE_ENV: development
      INPUT_BRIDGE_MODE: mock
      SERIAL_PATH: /dev/MOCK_ESP32
      SERIAL_BAUD: "115200"
      SERVER_URL: http://server:3001
    volumes:
      - ./apps/input-bridge/src:/app/apps/input-bridge/src
    depends_on:
      - server
    command: bun --watch src/index.ts
    mem_limit: 128m

volumes:
  postgres_dev_data:
