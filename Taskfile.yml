version: "3"

tasks:
  "docker:dev:up":
    desc: Démarrer la stack Docker (mode dev, volumes)
    cmds:
      - docker compose -f docker-compose.dev.yml up -d --build

  "docker:dev:down":
    desc: Arrêter la stack Docker dev
    cmds:
      - docker compose -f docker-compose.dev.yml down

  "docker:prod:up":
    desc: Démarrer la stack Docker (build type prod)
    cmds:
      - docker compose up -d --build

  "docker:prod:down":
    desc: Arrêter la stack Docker prod
    cmds:
      - docker compose down

  "docker:dev:restart":
    desc: Redémarrer les containers Docker dev sans rebuild
    cmds:
      - docker restart pinball-playfield-dev pinball-server-dev pinball-db-dev pinball-dmd-dev pinball-backglass-dev

  "db:dump":
    desc: Dump DB prod (format custom) dans ./backups/
    cmds:
      - mkdir -p backups
      - docker compose exec -T db pg_dump -U user -Fc pinball > backups/pinball-$(date +%Y-%m-%d_%H-%M).dump

  "db:restore":
    desc: "Restaure : task db:restore -- backups/pinball-XXX.dump"
    cmds:
      - docker compose exec -T db pg_restore -U user -d pinball --clean --if-exists < {{.CLI_ARGS}}

  "db:dump:dev":
    desc: Dump DB dev
    cmds:
      - mkdir -p backups
      - docker compose -f docker-compose.dev.yml exec -T db pg_dump -U dev_user -Fc pinball_dev > backups/pinball-dev-$(date +%Y-%m-%d_%H-%M).dump

  "db:restore:dev":
    desc: "Restaure dev : task db:restore:dev -- backups/XXX.dump"
    cmds:
      - docker compose -f docker-compose.dev.yml exec -T db pg_restore -U dev_user -d pinball_dev --clean --if-exists < {{.CLI_ARGS}}

  "check:leaks":
    desc: Grep-guard anti-fuite map (termes forbiddenInCore hors packages/maps)
    cmds:
      - bash scripts/check-map-leaks.sh

  "maps:validate":
    desc: "Valide une map : task maps:validate -- <mapId> (défaut strangerthings)"
    cmds:
      - bun scripts/validate-map.ts {{.CLI_ARGS}}

  clean:
    desc: Supprimer artefacts de build et node_modules
    cmds:
      - rm -rf node_modules apps/*/node_modules packages/*/node_modules apps/*/dist packages/*/dist apps/*/.next bun.lockb
