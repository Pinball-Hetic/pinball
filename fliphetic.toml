[app]
id          = "pinball-hetic"
name        = "Pinball Hetic"
authors     = ["Anthony", "Hugo", "Florian", "Imrane"]
description = "Three.js pinball across all three cabinet screens — physics-driven 3D playfield, live DMD score, backglass leaderboard."

[deploy]
strategy = "branch"
ref      = "dev"

[screens]
playfield = { service = "playfield", port = 3000 }
backglass = { service = "backglass", port = 3000 }
dmd       = { service = "dmd",       port = 3000 }

[compose]
file          = "docker-compose.yml"
ready_timeout = 120

[esp32.esp32]
firmware   = "firmware/build/firmware.bin"
chip       = "esp32"
flash_addr = "0x0"
baud       = 115200
required   = false

# ─────────────────────────────────────────────────────────────────────────────
# ESP32 — buttons firmware (firmware/src/main.cpp, protocole BTN série).
#
# Confirmed cabinet facts (from the reference app running on the cab):
#   - registered device name : "esp32"      (NOT "buttons")
#   - host serial path        : /dev/ttyUSB0 (classic ESP32, CP2102 USB-UART)
#   - flash baud              : 115200       (921600 drops the chip mid-write)
#   - image                   : merged, flashed at 0x0
#
# The merged binary is produced + committed by .github/workflows/firmware.yml
# (esptool merge_bin -> firmware/build/firmware.bin). Keep `required = false`
# until validated on the cab; switch to `true` afterwards to abort the load
# when flashing fails.

# ─────────────────────────────────────────────────────────────────────────────
